name: Validate Windows app

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: Arduino ${{ matrix.board }} keyboard firmware
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        board: [micro, leonardo]
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/setup-arduino-cli@v2.1.0
        with:
          version: '1.4.1'
      - name: Install AVR core and mouse library
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.8
          arduino-cli lib install Mouse@1.0.1
      - name: Test firmware sessions, capacity and watchdog
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror scripts/arduino_bridge/tests/state_test.cpp -o "$RUNNER_TEMP/bridge-state-test"
          "$RUNNER_TEMP/bridge-state-test"
      - name: Compile nine-key bitmap firmware
        run: arduino-cli compile --fqbn arduino:avr:${{ matrix.board }} scripts/arduino_bridge
      - name: Compile six-key compatibility firmware
        run: arduino-cli compile --fqbn arduino:avr:${{ matrix.board }} --build-property compiler.cpp.extra_flags=-DLOCOBOX_6KRO=1 scripts/arduino_bridge

  backend:
    name: Python 3.9 runtime regressions
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Test runtime, Arduino protocol, music and pet viewer
        run: python -m unittest discover -s tests -v

  desktop:
    name: Vue browser regressions and Tauri build
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Check types and build frontend assets
        run: npm run build

      - name: Install browser for regression tests
        run: npx playwright install chromium

      - name: Test startup, overlays, music and pet viewer in Chromium
        run: npm test -- --workers=2

      - name: Test desktop backend identity checks
        working-directory: frontend/src-tauri
        run: cargo test --locked --lib

      - name: Build desktop executable without installer
        run: npm run desktop:build

      - name: Retain browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-failures
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

      # app.exe embeds the frontend, but still needs this repository's backend
      # and .venv. Do not publish it as a standalone release or installer.
