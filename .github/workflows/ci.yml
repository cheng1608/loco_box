name: Validate Windows app

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python 3.9 runtime regressions
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Test backend lifecycle and desktop shutdown
        run: python -m unittest discover -s tests -v

  desktop:
    name: Vue browser regressions and Tauri build
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Check types and build frontend assets
        run: npm run build

      - name: Install browser for regression tests
        run: npx playwright install chromium

      - name: Test delayed startup, reconnection and preview subscriptions
        run: npm test

      - name: Test desktop backend identity checks
        working-directory: frontend/src-tauri
        run: cargo test --locked --lib

      - name: Build desktop executable without installer
        run: npm run desktop:build

      - name: Retain browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-failures
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

      # app.exe embeds the frontend, but still needs this repository's backend
      # and .venv. Do not publish it as a standalone release or installer.
